name: Atualizar cartões do perfil

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_cards.py
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gerar cartões com dados públicos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_cards.py
      - name: Publicar cartões atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs: atualiza dados públicos do perfil'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
